# agal.toml — project configuration for agal.
# Place next to your workspace Cargo.toml. All fields optional.
#
# Auto-detected: project_name, internal path deps, frameworks, Lx* UI exports.
# Zero-config still applies default migration truce-slint → lx-slint-editor
# (dogfood path). Override with [migrations.*] for other stacks.

# --- minimal ---
# project_name = "My Audio Plugins"
# output_dir = "agal"

# [migrations.old-to-new]
# from = "old-adapter"
# to = "new-adapter"

# [rules]
# crate_vs_plugin = "Reusable logic in crates/, product logic in plugins/."
# plugin_target_editor = "Use new-adapter for all plugins."

# [[suppress]]
# code = "large_param_surface"
# node = "my-plugin"          # name, path, or id; omit / "*" = all
# reason = "intentional product surface"

# --- API map budget (Aider-style ranked signatures) ---
# [map]
# api_tokens = 800           # approximate signature token budget across workspace
# max_symbols_per_crate = 12 # top-K signatures shown per crate
# rank = "inbound_deps"      # reserved: "inbound_deps" (future: refcount / pagerank)

# --- dogfood extras (LX / AURA + Slint) ---
# ui_crates = ["lx-ui-slint"]          # also auto-detected via `export component Lx*`
# ipc_hubs = ["lx-shm", "lx-analysis"]

# [frameworks.my-adapter]
# name = "my-adapter"
# kind = "editor_adapter"
# notes = "Custom UI bridge"
